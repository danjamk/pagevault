name: Deploy to production

# Maintainer tooling — NOT part of the fork-and-publish path.
#
# A forker who clones PageVault never needs this file. `make setup && make deploy` is the whole
# story: it deploys to whichever account their .env.local token points at. Delete this workflow in
# a fork and nothing breaks. It is inert without the `production` environment's secrets.
#
# The model (#38): which Cloudflare account gets deployed IS whichever credential is active.
#   dev  — the token in a working clone's .env.local; every local `make deploy` hits dev.
#   prod — a token that lives ONLY in this GitHub Environment's secrets; only this job reaches it.
# That is what removes the wrong-clone-clobbers-prod footgun: the prod credential is simply not
# present on a developer's machine.
#
# This once said "there is no environment concept in the product". ADR-021 made that false — a
# deployment is now a named thing in ~/.pagevault/deployments.json, and commands resolve one by
# name, by where you are standing, or by the default. What did NOT change is the line above: the
# Cloudflare credential stays per-clone, so the registry never puts prod's deploy rights on a
# laptop.
#
# Trigger is manual on purpose (workflow_dispatch). Tagging a release never ships prod — version is
# decoupled from deployment (ADR-010). You click Run when you mean it.

on:
  workflow_dispatch:

# Never let two prod deploys overlap. Don't cancel one in flight — a half-applied deploy is worse
# than a queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scopes the three secrets below to THIS job only (ci.yml can't read them), and is where an
    # optional required-reviewer gate lives. Free on a public repo.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          # releaseTag() reads the short SHA; the health check compares it against /health.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The prod intent file. Gitignored on the repo, so CI reconstructs it from one base64'd
      # secret — host, accountId, ownerEmail, kvId, team, AUDs, groupId all come back exactly as
      # they were provisioned. See docs/deploy-prod.md for how to capture it.
      - name: Restore .pagevault.json (prod intent)
        run: printf '%s' "$PAGEVAULT_PROD_CONFIG" | base64 -d > .pagevault.json
        env:
          PAGEVAULT_PROD_CONFIG: ${{ secrets.PAGEVAULT_PROD_CONFIG }}

      # Snapshot prod KV BEFORE the deploy touches anything (#34). The artifact is your restore
      # point — if a deploy goes wrong, download it and `make restore`. Named to match .gitignore
      # so it never dirties the tree (which would put "-dirty" in the baked version).
      - name: Back up prod KV
        run: node cli/bin/pagevault.mjs backup --out pagevault-backup-prod.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: actions/upload-artifact@v6
        with:
          name: prod-kv-backup
          path: pagevault-backup-prod.json
          retention-days: 30
          if-no-files-found: ignore # a brand-new prod namespace is empty — no file, and that's fine

      # The one deploy path, reused — no forked logic. Non-interactive, so its prompts auto-skip.
      # The bearer is reused from the Worker (never rotated); on a first-ever prod deploy it is set
      # from the PAGEVAULT_API_TOKEN secret. CF_RUNTIME_TOKEN becomes the Worker's scoped runtime
      # secret (ADR-002 group sync).
      - name: Deploy the Worker
        run: node cli/lib/provision/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_RUNTIME_TOKEN: ${{ secrets.CF_RUNTIME_TOKEN }}
          PAGEVAULT_API_TOKEN: ${{ secrets.PAGEVAULT_API_TOKEN }}

      # Close the loop: assert /health reports the exact <version>+<sha> we just shipped. Fails the
      # run if the rollout didn't take. No token needed — /health is public.
      - name: Verify the deployed build
        run: node cli/bin/pagevault.mjs health
