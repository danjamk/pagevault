name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build if the artifact iframe is ever granted our origin. See ADR-007.
      - run: make check-sandbox

      # Fails the build if a doc describes something the code doesn't do — dead routes, commands
      # that don't exist, MCP tools that aren't registered, broken links. Every instance found so
      # far was mechanical and had survived months of people reading the page.
      #
      # Invoked directly, not via `make check-docs`. Every make target except check-sandbox is
      # prefixed with $(NVM), which sources ~/.nvm/nvm.sh — absent on a runner using
      # actions/setup-node, so the recipe dies before the script runs. Same reason `pnpm test` and
      # the node --test suites below are called directly. `make check-docs` remains the local door.
      - run: node scripts/check-docs.mjs

      # Fails the build if the browser JavaScript the Worker emits doesn't parse. It lives inside
      # TypeScript template literals, so tsc sees string content, not code: an unbalanced brace in
      # the console passes `pnpm typecheck` below with exit 0 and all 25 console tests, and ships a
      # blank admin page. Same direct invocation as check-docs, for the same $(NVM) reason.
      - run: node scripts/check-console.mjs

      - run: pnpm typecheck

      - run: pnpm test

      # The setup/deploy scripts and the CLI carry their own node --test suites (schema migration,
      # KV backup, bearer policy, CLI parsing). `pnpm test` is vitest only, so run these too or
      # they guard nothing in CI.
      - run: node --test scripts/*.test.mjs cli/*.test.mjs

      # Pack-and-install smoke (#56): exercise the PUBLISHED tarball — the files allowlist, the bin
      # path, the shebang — which the in-repo unit tests never touch. Catches a broken package at PR
      # time, not at the permanent `npm publish`.
      - run: node cli/smoke.mjs