name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build if the artifact iframe is ever granted our origin. See ADR-007.
      - run: make check-sandbox

      - run: pnpm typecheck

      - run: pnpm test

      # The setup/deploy scripts carry their own node --test suites (schema migration, KV backup,
      # bearer policy). `pnpm test` is vitest only, so run these too or they guard nothing in CI.
      - run: node --test scripts/*.test.mjs