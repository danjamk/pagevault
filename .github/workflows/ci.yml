name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual, because event triggers are not guaranteed to arrive. During the Actions incident of
  # 2026-08-06 webhooks were throttled to ~15%, so a PR and its merge to main both landed with no
  # run created and no way to ask for one — main sat unverified with the only recourse being an
  # empty commit. `deploy-prod.yml` already had this and stayed usable throughout.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to check (defaults to the branch you launch it from)
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty on push/pull_request, which is exactly the default behaviour. Only a manual
          # run can name something else — e.g. verifying a main commit whose push webhook
          # never arrived.
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build if the artifact iframe is ever granted our origin. See ADR-007.
      - run: make check-sandbox

      # Fails the build if a doc describes something the code doesn't do — dead routes, commands
      # that don't exist, MCP tools that aren't registered, broken links. Every instance found so
      # far was mechanical and had survived months of people reading the page.
      #
      # Invoked directly, not via `make check-docs`. Every make target except check-sandbox is
      # prefixed with $(NVM), which sources ~/.nvm/nvm.sh — absent on a runner using
      # actions/setup-node, so the recipe dies before the script runs. Same reason `pnpm test` and
      # the node --test suites below are called directly. `make check-docs` remains the local door.
      - run: node scripts/check-docs.mjs

      # Fails the build if the browser JavaScript the Worker emits doesn't parse. It lives inside
      # TypeScript template literals, so tsc sees string content, not code: an unbalanced brace in
      # the console passes `pnpm typecheck` below with exit 0 and all 25 console tests, and ships a
      # blank admin page. Same direct invocation as check-docs, for the same $(NVM) reason.
      - run: node scripts/check-console.mjs

      - run: pnpm typecheck

      - run: pnpm test

      # The setup/deploy scripts and the CLI carry their own node --test suites (schema migration,
      # KV backup, bearer policy, CLI parsing). `pnpm test` is vitest only, so run these too or
      # they guard nothing in CI.
      - run: node --test scripts/*.test.mjs cli/*.test.mjs

      # Pack-and-install smoke (#56): exercise the PUBLISHED tarball — the files allowlist, the bin
      # path, the shebang — which the in-repo unit tests never touch. Catches a broken package at PR
      # time, not at the permanent `npm publish`.
      - run: node cli/smoke.mjs

  # The npm package is the product (ADR-014), and it installs on machines I do not have. This job
  # covers the part of Windows that CI CAN reach: that the packed tarball installs, that the bin
  # shim resolves to `pagevault.cmd`, and that the path handling holds up on NTFS (#139).
  #
  # SCOPE — read this before trusting a green check. It does NOT cover provisioning. `init`,
  # `upgrade` and `deploy` need a real Cloudflare account and a live API token, so the two defects
  # that made this job worth adding — the unquoted `--config` path and the JSON-escaped bundle path
  # — are guarded by the unit tests above, NOT by anything here. Native Windows provisioning is
  # verified by hand: docs/engineering/windows-smoke-test.md.
  #
  # Deliberately omitted: pnpm test (vitest-pool-workers boots workerd — that tests Cloudflare's
  # Windows port, not this package), typecheck, check-docs, check-console, check-sandbox. All are
  # platform-independent and already proven on ubuntu; running them twice buys nothing and doubles
  # the surface that can go red for reasons unrelated to Windows.
  windows:
    runs-on: windows-latest
    # bash, not the PowerShell default: the test step below relies on glob expansion, which
    # PowerShell does not do for external commands — node would receive the literal `scripts/*.test.mjs`.
    # git-bash ships on the runner, so this costs nothing.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty on push/pull_request, which is exactly the default behaviour. Only a manual
          # run can name something else — e.g. verifying a main commit whose push webhook
          # never arrived.
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The CLI's own suites: path handling, arg parsing, and the #139 regressions (a config path
      # with a space, a Windows bundle path surviving as JSON, the color guard, the WSL DNS hint).
      - run: node --test scripts/*.test.mjs cli/*.test.mjs

      # The highest-signal step here: does `npm install` of the real tarball produce a working
      # `pagevault` command on Windows at all — bin shim, shebang, files allowlist.
      - run: node cli/smoke.mjs